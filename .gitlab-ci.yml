stages:
  - check
  - build
  - test

variables:
  # Name of this project's module in the Flatpak manifest.
  FLATPAK_MODULE: "vocalis"
  # Path to the Flatpak manifest.
  MANIFEST_PATH: "build-aux/app.drey.Vocalis.Devel.json"
  # Flatpak application ID (development profile).
  APP_ID: "app.drey.Vocalis.Devel"

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH

include:
  - local: .gitlab-ci/check.yml
  - local: .gitlab-ci/build.yml
  - local: .gitlab-ci/test.yml
