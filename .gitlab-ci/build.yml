# Build the Flatpak with GNOME's shared CI templates.

include:
  - project: "GNOME/citemplates"
    file: "flatpak/flatpak_ci_initiative.yml"

variables:
  RUNTIME_REPO: "https://nightly.gnome.org/gnome-nightly.flatpakrepo"
  BUNDLE: "${APP_ID}.flatpak"

build@x86_64:
  extends:
    - .flatpak@x86_64
  stage: build

build@aarch64:
  extends:
    - .flatpak@aarch64
  stage: build
