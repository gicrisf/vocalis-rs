# Shared bits for CI jobs.

# Image with GTK4/libadwaita/GStreamer development headers and a Rust toolchain.
# build.rs runs blueprint-compiler, so it must be available to the check/test jobs.
.dev_image:
  image: 'ghcr.io/gtk-rs/gtk4-rs/gtk4:latest'
  interruptible: true
  before_script:
    - |
      set -e
      if ! command -v blueprint-compiler >/dev/null 2>&1; then
        if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then SUDO=sudo; else SUDO=; fi
        if command -v dnf >/dev/null 2>&1; then
          $SUDO dnf install -y blueprint-compiler
        elif command -v apt-get >/dev/null 2>&1; then
          $SUDO apt-get update && $SUDO apt-get install -y blueprint-compiler
        elif command -v apk >/dev/null 2>&1; then
          $SUDO apk add blueprint-compiler
        else
          echo "blueprint-compiler is required to build (build.rs) but no package manager was found" >&2
          exit 1
        fi
      fi
      blueprint-compiler --version
